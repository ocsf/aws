name: Metaschema Validation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    name: Validate the extension satisfies the requirements of the metaschema
    runs-on: ubuntu-latest
    steps:
    - name: Checkout ocsf-schema
      uses: actions/checkout@v6
      with:
        repository: ocsf/ocsf-schema
        path: ocsf-schema

    - name: Checkout aws extension
      uses: actions/checkout@v6
      with:
        path: ocsf-schema/extensions/aws

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"

    - name: Install validator
      run: python -m pip install "ocsf-validator>=${{ vars.SCHEMA_VALIDATOR_VERSION || '0.2,<0.3' }}"

    - name: Run validator
      shell: bash
      run: export FORCE_COLOR=1 && python -m ocsf_validator ocsf-schema
