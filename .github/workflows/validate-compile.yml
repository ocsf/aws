name: Compile Validation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-ocsf-schema-compiler:
    name: Validate the extension compiles with ocsf-schema-compiler
    runs-on: ubuntu-latest
    steps:
    - name: Checkout aws extension
      uses: actions/checkout@v6
      with:
        path: aws
    - name: Checkout ocsf-schema
      uses: actions/checkout@v6
      with:
        repository: ocsf/ocsf-schema
        path: ocsf-schema
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"
    - name: Compile schema with extension
      run: |
        python -m pip install ocsf-schema-compiler
        # Compile the base schema with the AWS extension, allow shadowing
        ocsf-schema-compiler ocsf-schema -e aws -a > /dev/null
